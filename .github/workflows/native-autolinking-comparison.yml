name: Compare native autolinking

on:
  pull_request:
    paths:
      - package.json
      - packages/frontend/package.json
      - bun.lock
      - .github/workflows/native-autolinking-comparison.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install both frozen graphs
        run: |
          (cd baseline && bun install --frozen-lockfile)
          bun install --frozen-lockfile
      - name: Compare Expo selections on Android and Apple
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createRequire } from 'node:module';
          import { dirname, join, resolve } from 'node:path';

          function inspect(repository, platform) {
            const repo = resolve(repository);
            const root = join(repo, 'packages/frontend');
            const fromApp = createRequire(join(root, 'package.json'));
            const cli = join(dirname(fromApp.resolve('expo-modules-autolinking/package.json')), 'bin/expo-modules-autolinking.js');
            const result = JSON.parse(execFileSync(process.execPath, [cli, 'resolve', '--platform', platform, '--project-root', root, '--json'], { encoding: 'utf8' }));
            if (!Array.isArray(result.modules)) throw new Error('Invalid Expo resolver result');
            return result.modules.map(module => JSON.stringify(module).replaceAll(repo, '<repo>')).sort();
          }
          for (const platform of ['android', 'apple']) {
            const before = inspect('baseline', platform);
            const after = inspect('.', platform);
            if (JSON.stringify(before) !== JSON.stringify(after)) {
              const removed = before.filter(item => !after.includes(item));
              const added = after.filter(item => !before.includes(item));
              console.error(JSON.stringify({ platform, removed, added }, null, 2));
              throw new Error(`Expo selections differ on ${platform}`);
            }
            console.log(`${platform}: ${before.length} selected module entries identical`);
            for (const name of ['@oxy.so/services', 'expo-crypto']) {
              const selected = after.map(item => JSON.parse(item)).filter(item => item.packageName === name);
              if (selected.length !== 1) throw new Error(`Expected one ${name} on ${platform}`);
              console.log(JSON.stringify({ platform, package: name, version: selected[0].packageVersion, projects: selected[0].projects, pods: selected[0].pods, modules: selected[0].modules }));
            }
          }
          NODE
