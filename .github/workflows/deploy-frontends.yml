name: Deploy Frontends

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-frontends.yml'
      - 'packages/frontend/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'bun.lock'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Build shared types
        run: bun run --cwd packages/shared-types build
      - name: Build frontend
        run: bun run --cwd packages/frontend build
        timeout-minutes: 60
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
          # EXPO_PUBLIC_* is substituted at build time, so these are baked
          # into the bundle and cannot be changed without another build.
          #
          # Matrix, on our own homeserver. The Express backend it replaces
          # encrypts with static ECDH and no KDF, encrypts groups only for the
          # first participant, and never had working media — see
          # docs/encryption.mdx for what it actually does versus what its
          # filenames claim.
          EXPO_PUBLIC_CHAT_BACKEND: matrix
          # allo.you, not matrix.allo.you: `server_name` is what decides the
          # MXIDs, and allo.you/.well-known/matrix/server — served from
          # public/ in this repository — is what points the world at the host
          # below. That is why accounts here read @someone:allo.you.
          #
          # This value is the client-server API host, which is a different
          # thing from the server name and must not be confused with it.
          EXPO_PUBLIC_MATRIX_HOMESERVER: https://matrix.allo.you
          #
          # No OIDC client id: MAS advertises a registration_endpoint and the
          # client registers itself, holding no secret. The one secret in this
          # system belongs to MAS, which is a confidential client of Oxy and
          # runs in ECS. The redirect URI defaults to https://allo.you/ — the
          # app itself, because the authorization is a top-level redirect and
          # it is the app that finishes the login on the way back in. It used
          # to be a static file in public/, for a popup that no longer exists;
          # see lib/chat/matrixAuthorizer.web.ts.
          #
          # If you change either value, verify the OUTPUT rather than the exit
          # code: Metro caches transforms and will happily produce a bundle
          # where neither was substituted. CI installs from scratch so it has
          # no such cache; a local `bun run build` does, and needs `--clear`.
      # A WORKER, not a Pages project. A Pages project always serves
      # `<project>.pages.dev` with no way to turn it off, which put a second copy
      # of Allo on the internet at `allo-frontend.pages.dev` — an origin the
      # backend's `APP_ORIGINS` does not admit, so it rendered the shell and
      # failed every call. `workers_dev = false` in
      # `packages/frontend/wrangler.toml` leaves `allo.you` as the only way in.
      # The Pages project also served `allo.oxy.so`; that alias is retired by
      # owner decision in the same change, so it is detached and its DNS record
      # deleted at cutover and it is deliberately left not resolving. This does
      # NOT touch `api.allo.oxy.so`, a different host that is not served here.
      #
      # wrangler is invoked DIRECTLY, not through `cloudflare/wrangler-action`.
      # The action installs its own wrangler and chooses the package manager by
      # looking for a lockfile beside its `workingDirectory`. In a monorepo the
      # lockfile is at the root, so it falls back to npm and npm chokes on
      # `workspace:*`. Homiio took a production outage from exactly this on
      # 2026-08-09 (run 31292337344: `Fail extracting tarball for "wrangler"`) —
      # it published nothing and left a stale bundle running against a changed
      # API — and moved off the action in its #291. Do not reintroduce it.
      #
      # `wrangler@4` is pinned to the major on purpose: unpinned, `bunx wrangler`
      # re-resolves the newest major on every run, which changes the deploy path
      # with no diff to show for it.
      - name: Deploy the Worker
        run: cd packages/frontend && bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
