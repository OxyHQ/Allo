# Temporary diagnostic: faithful structural copy of deploy-aws.yml with every
# AWS-mutating step replaced by an echo. Measures one thing only — whether the
# run gets scheduled at all. Both runner labels already proved fine.
name: Runner probe

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  APP: allo

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Secrets context is readable
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: echo "$SECRETS_JSON" | jq -r 'keys|length' | xargs -I{} echo "{} secrets visible"

      - name: Configure AWS credentials (OIDC, no stored keys)
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        continue-on-error: true
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - run: echo "probe reached the end"
