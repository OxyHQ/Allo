# Reusable AWS deploy workflow — copy to each repo as .github/workflows/deploy-aws.yml
# and substitute allo (ecs service + ecr repo name) and packages/backend/Dockerfile (path).
# Al copiarlo, revise también la lista de secretos del paso de sincronización:
# ya no se descubren solos, se enumeran.
name: Deploy to AWS

on:
  # After CI passes on a push to main, never alongside it. Until 2026-10 this ran
  # on `push`, in parallel with CI, so a commit whose CI went red could still
  # reach production, and every merge that touched anything but Markdown rolled
  # the backend, frontend-only ones included. The `scope` job below owns the
  # guards and the path scope `push` used to give, narrowed to what the backend
  # image and its rollout are built from.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Releases main's head on demand, and still only once CI succeeded on a push
  # for it (`deploy-scope.sh gate` checks that, once, and refuses otherwise).
  workflow_dispatch:

# Un despliegue que no arranca no se ve en rojo en ninguna parte: CI queda en
# verde, el PR queda fusionado y producción se queda atrás en silencio. Antes de
# dar por desplegado un cambio de backend, compruébelo contra el servicio.

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: allo
  CLUSTER: oxy-cluster
  # The commit under release: the one CI tested on `workflow_run`, main's head on
  # a dispatch. Not `github.sha`, which on `workflow_run` is whatever main's head
  # was when CI finished. Not named DEPLOY_SHA: deploy-ecs-image.sh reads that
  # name to arm a head guard script this repository does not carry.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Decides, OUTSIDE the release lane, whether `deploy` runs at all: the trigger
  # guards, which commit to release, and the path scope. See
  # .github/scripts/deploy-scope.sh for why each is needed once the trigger is
  # `workflow_run`. It must sit outside the concurrency group: GitHub cancels a
  # PENDING run when another queues behind it in the same group, so a run for an
  # older commit whose CI finished late could displace a pending release of a
  # newer one and then hold itself, leaving neither deployed.
  scope:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job level: no OIDC token here, and `actions: read` (CI's runs, the release
    # marker) reaches no other job.
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.backend.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Release only the newest CI-green main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-scope.sh gate
      # What goes into the backend image or its rollout, diffed against the last
      # commit this workflow actually released, so a frontend- or SDK-only merge
      # (deploy-frontends.yml ships those) does not roll the API.
      # packages/backend/Dockerfile copies the root manifests, every workspace
      # package.json, patches/, contracts, shared-types and the backend; the
      # `.dockerignore` and the release scripts (deploy-ecs-image.sh, the
      # reviewed-image pin) change what is built or how it rolls out. The same
      # set as CI's `image` filter. test-deploy-scope.sh reads this line.
      - name: Decide whether anything the backend ships changed
        id: backend
        if: steps.gate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_PATHS: '^(packages/(backend|contracts|shared-types)/|packages/[^/]+/package\.json$|package\.json$|bun\.lock$|bunfig\.toml$|tsconfig\.json$|patches/|\.github/workflows/deploy-aws\.yml$|\.github/scripts/)|\.dockerignore$'
        run: bash .github/scripts/deploy-scope.sh target backend include "$BACKEND_PATHS" allo-release-backend-

  deploy:
    needs: scope
    # `scope` admits only a commit CI passed on a push to main in this
    # repository, the newest such commit, with something backend to release.
    # The ref check stays as well: only the protected main branch may assume
    # the AWS deploy role.
    if: github.ref == 'refs/heads/main' && needs.scope.outputs.backend == 'true'
    # On the JOB, not the workflow, so only a run `scope` judged releasable ever
    # enters the lane.
    #
    # Dos merges seguidos lanzan dos `update-service --force-new-deployment` sobre
    # el mismo servicio y ninguno llega a estabilizarse. Los despliegues se
    # encolan en vez de solaparse; no se cancela el que esté en curso, porque
    # abortar a mitad deja el servicio con la mitad de las tareas en la revisión
    # nueva. A newer pending run may replace an older pending one, which is safe:
    # its scope diffs from the last commit actually released, so it carries the
    # older.
    concurrency:
      group: deploy-allo-backend
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    # The image build, then the pre-migration task, the rollout and the
    # post-migration task, each bounded by deploy-ecs-image.sh's MAX_WAIT_SECS
    # (20 min), plus a rollback window; recent successful runs took 4-6 min.
    # Without a bound a hung step holds a runner for GitHub's 6-hour default.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Los secretos se enumeran de uno en uno, a propósito.
      #
      # Este paso expandía el contexto `secrets` entero con `toJSON(secrets)`, y
      # eso es lo que tenía los despliegues parados: GitHub crea el run con
      # conclusión `action_required` y CERO jobs, sin aprobación pendiente que
      # conceder y sin que la API diga el motivo en ningún campo. Verificado
      # A-B-A-B sobre este mismo repo: quitando esa expresión el run arranca,
      # devolviéndola vuelve a bloquearse.
      #
      # Enumerar es además el mínimo privilegio. El bucle anterior copiaba todo
      # secreto visible al repo, así que CLOUDFLARE_API_TOKEN y NPM_TOKEN —que
      # son de otros workflows— acababan en el espacio SSM de esta app.
      #
      # Al añadir un secreto nuevo hay que añadirlo aquí; si no, no llega a SSM.
      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          APP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sync_secret() {
            name="$1"; value="$2"; path="$3"
            if [ -z "$value" ] || [ "$value" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $name; SSM unchanged"
              return 0
            fi
            aws ssm put-parameter --name "$path" --value "$value" --type SecureString --overwrite >/dev/null
            echo "synced -> $path"
          }

          # Postgres. Required at boot — `server.ts` refuses to start without
          # it — and it was live in SSM and on the task definition while being
          # enumerated NOWHERE, so a rotation of the GitHub secret would never
          # have reached the running service. Its terraform declaration landed in
          # oxy-infra #44; this is the other half.
          sync_secret DATABASE_URL "$APP_DATABASE_URL" "/oxy/$APP/DATABASE_URL"

          # Sin REDIS_URL. `/oxy/_shared/REDIS_URL` es de la Terraform de
          # oxy-infra (terraform-uswest2/redis.tf), y el despliegue de una app
          # nunca debe escribir un parámetro compartido: seis repos copiaban cada
          # uno su propio secrets.REDIS_URL, dos tenían valores distintos y cada
          # despliegue lo cambiaba de clúster (incidente 2026-09-27). La task
          # definition de allo lo sigue LEYENDO; solo se quita la escritura.

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `--cache-from/--cache-to type=gha` below need the Actions runtime token
      # and cache URL, which GitHub gives to JavaScript actions and NOT to `run:`
      # steps; without them buildx skips the cache silently. Only this main-only
      # job writes the `allo` scope; no pull_request workflow does.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v4

      # Production builds only what the owner reviewed. The Dockerfile, its
      # context, target and both .dockerignore files are hashed and compared
      # with the ONE pin in .github/scripts/reviewed-images.json; a mismatch
      # stops here, before anything is built or pushed. The Dockerfile path,
      # context and the label values below are this step's outputs, so the
      # build cannot use a different file than the one checked, and no hash is
      # spelled out in this workflow to drift from the pin. CI runs the same
      # check on every pull request (`reviewed-image.py check`, Lint job), so a
      # change that would stop here fails before it can merge, and CI's image
      # smoke builds and boots this same recipe on every PR that touches it.
      - name: Refuse unreviewed image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe allo

      - name: Build and push (linux/arm64)
        id: build
        env:
          COMMIT_TAG: ${{ env.RELEASE_SHA }}
          DOCKERFILE: ${{ steps.reviewed.outputs.dockerfile }}
          CONTEXT: ${{ steps.reviewed.outputs.context }}
          SOURCE_TREE: ${{ steps.reviewed.outputs.source_tree }}
          BUILD_INPUTS_SHA256: ${{ steps.reviewed.outputs.build_inputs_sha256 }}
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          # The digest comes out of the build itself, via --metadata-file.
          # Resolving it afterwards with `aws ecr describe-images` is not an
          # option here: oxy-github-deploy has no ecr:DescribeImages, confirmed
          # with `aws iam simulate-principal-policy` (implicitDeny), so that
          # call fails at deploy time behind a green build.
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP \
            --cache-to type=gha,scope=$APP,mode=max,ignore-error=true \
            -f "$DOCKERFILE" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "io.oxy.source.tree=$SOURCE_TREE" \
            --label "io.oxy.build-inputs.sha256=$BUILD_INPUTS_SHA256" \
            -t "$IMG:$COMMIT_TAG" \
            -t "$IMG:latest" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            "$CONTEXT"

          # :latest is still moved, but nothing that deploys reads it. It exists
          # so a from-scratch `terraform apply` -- whose app-service module
          # declares `<repo>:latest` as the task definition's bootstrap image --
          # creates the service on a current build rather than an ancient one.
          DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable image digest (got: ${DIGEST:-<empty>})"
            exit 1
          fi
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"
          echo "Built $COMMIT_TAG -> $DIGEST"

      - name: Register immutable task definition and deploy
        env:
          # Set only after the dedicated relay passes the infra runbook. Values
          # are owned in SSM, never synced from GitHub, and _shared/LIVEKIT_*
          # stays read-only. Turning this off does not erase a live binding.
          ALLO_TURN_ENABLED: ${{ vars.ALLO_TURN_ENABLED }}
          # The pipeline renders the RUNNING revision; declaring these only in
          # Terraform never puts the shared SFU configuration into that image.
          TASK_ENV_OVERRIDES_JSON: '{"LIVEKIT_URL":"wss://livekit.oxy.so"}'
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          # The deploy applies this release's schema. Until now it shipped the
          # image and left the migrations behind, so `0000` and `0001` had to be
          # applied by hand — and for ten minutes the service served code whose
          # tables did not exist, behind a health check that never touches the
          # database.
          #
          # It has to be the deploy rather than a preceding manual step: a
          # release's migrations exist only inside that release's IMAGE, so they
          # cannot be applied from the revision currently running. The script
          # registers the new task definition, runs this one-shot FROM it, and
          # only then updates the service — which is the sole ordering that works.
          RUN_MIGRATIONS: "true"
          # The container runs TypeScript directly (see the Dockerfile's CMD), so
          # there is no `dist/`; and this migrator refuses to run without both
          # arguments rather than guessing a target or a phase.
          MIGRATION_TASK_COMMAND_JSON: >-
            ["bun","run","--cwd","packages/backend","db:migrate","--target-database=allo","--phase=pre"]
          # `post` runs AFTER the rollout, which is what the phase means: it
          # carries drops, renames and narrowings that the previous image cannot
          # tolerate. `0003` is the first `post` migration in this repo, so
          # without this step a clean cut would land half-finished with nothing
          # complaining — the additive half applied, the narrowing half never.
          POST_DEPLOY_TASK_COMMAND_JSON: >-
            ["bun","run","--cwd","packages/backend","db:migrate","--target-database=allo","--phase=post"]
        run: |
          export TASK_SECRET_OVERRIDES_JSON='{
            "LIVEKIT_API_KEY":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/_shared/LIVEKIT_API_KEY",
            "LIVEKIT_API_SECRET":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/_shared/LIVEKIT_API_SECRET"
          }'
          if [ "$ALLO_TURN_ENABLED" = "true" ]; then
            export TASK_SECRET_OVERRIDES_JSON="$(jq -c '. + {
              "TURN_SHARED_SECRET":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/allo/TURN_SHARED_SECRET",
              "TURN_URLS":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/allo/TURN_URLS",
              "STUN_URLS":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/allo/STUN_URLS",
              "TURN_TTL_SECONDS":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/allo/TURN_TTL_SECONDS",
              "TURN_REQUIRED":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/allo/TURN_REQUIRED"
            }' <<< "$TASK_SECRET_OVERRIDES_JSON")"
          elif [ -n "$ALLO_TURN_ENABLED" ] && [ "$ALLO_TURN_ENABLED" != "false" ]; then
            echo '::error::ALLO_TURN_ENABLED must be true or false'
            exit 1
          fi
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet - image is in ECR, skipping deploy"
            exit 0
          fi
          bash .github/scripts/deploy-ecs-image.sh

      # The scope job's base for the next release: the last commit this workflow
      # actually rolled out, as an Actions cache key (its content is irrelevant).
      # Only a successful rollout reaches this step, and it runs on main only, so
      # no pull request can move it. Lost or evicted, the next run releases.
      - name: Write the release marker
        run: printf '%s\n' "$RELEASE_SHA" >"$RUNNER_TEMP/release-marker"
      - name: Record this release for the next scope decision
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-marker
          key: allo-release-backend-${{ env.RELEASE_SHA }}
