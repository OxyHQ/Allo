# Reusable AWS deploy workflow — copy to each repo as .github/workflows/deploy-aws.yml
# and substitute allo (ecs service + ecr repo name) and packages/backend/Dockerfile (path).
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# PENDIENTE: los despliegues desde `main` no arrancan.
#
# Desde el 2026-08-02 ~01:25, cada run de este workflow disparado por `push` a
# `main` termina en `action_required` con CERO jobs — nunca empieza. `CI` y
# `Deploy Frontends` sí corren sobre los mismos commits, así que no es del repo
# ni de la organización: es de este workflow, en esta rama.
#
# Descartado que lo cause un bloque `concurrency` que se probó y se revirtió: el
# run del propio commit de revert, sin ese bloque, quedó igualmente en
# `action_required`. La API no da más: sin aprobaciones pendientes, Actions
# habilitado, workflow activo, actor el propietario.
#
# Lo que queda por mirar, y necesita la interfaz web porque la API no lo expone:
# el motivo que GitHub muestra en la propia página del run. Suele ser una regla
# de aprobación o un límite de gasto de Actions.
#
# Ojo al modo de fallo mientras tanto: un despliegue que no arranca no aparece en
# rojo en ningún sitio. CI queda en verde, el PR queda fusionado, y producción se
# queda atrás en silencio. Antes de dar por desplegado un cambio de backend,
# compruébelo contra el servicio, no contra el estado del PR.
#
# El problema que motivó aquel `concurrency` sigue abierto: el 2026-08-02 dos
# merges separados por 79 segundos lanzaron dos `update-service
# --force-new-deployment` sobre el mismo servicio y ninguno se estabilizó. Su
# mitigación hoy es de proceso: no fusionar dos PRs seguidos sin dejar que el
# primero termine de desplegar.
#
# Los otros backends (alia, homiio, syra) SÍ llevan un bloque `concurrency`
# junto al anclaje por digest. Aquí se omite a propósito: mientras `main` siga
# sin arrancar por un motivo no diagnosticado, añadir la misma construcción que
# se probó y se revirtió mete una segunda variable en la misma investigación.
# Es un pendiente, no un descarte — reintrodúzcalo cuando el disparador esté
# explicado.

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: allo
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/backend/Dockerfile

jobs:
  deploy:
    # workflow_dispatch can be run against arbitrary refs; only deploys from the
    # protected main branch may assume the AWS deploy role.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          SHARED="AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY REDIS_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET"
          echo "$SECRETS_JSON" | jq -r 'to_entries[] | select((.key|ascii_upcase) as $k | ($k=="GITHUB_TOKEN" or ($k|startswith("ACTIONS_")))|not) | [.key,.value]|@tsv' | \
          while IFS=$'\t' read -r k v; do
            [ -z "$k" ] && continue
            if [ -z "$v" ] || [ "$v" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $k; SSM unchanged"
              continue
            fi
            if [ "$k" = "REDIS_URL" ] && [ "$AWS_REGION" = "us-west-2" ] && ! printf '%s' "$v" | grep -q '\.usw2\.cache\.amazonaws\.com'; then
              echo "::warning::skip REDIS_URL because it does not point at the us-west-2 Valkey endpoint; SSM unchanged"
              continue
            fi
            case " $SHARED " in *" $k "*) path="/oxy/_shared/$k";; *) path="/oxy/$APP/$k";; esac
            aws ssm put-parameter --name "$path" --value "$v" --type SecureString --overwrite >/dev/null && echo "synced -> $path"
          done

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        id: build
        env:
          COMMIT_TAG: ${{ github.sha }}
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          # The digest comes out of the build itself, via --metadata-file.
          # Resolving it afterwards with `aws ecr describe-images` is not an
          # option here: oxy-github-deploy has no ecr:DescribeImages, confirmed
          # with `aws iam simulate-principal-policy` (implicitDeny), so that
          # call fails at deploy time behind a green build.
          docker buildx build \
            --platform linux/arm64 \
            -f "$DOCKERFILE" \
            -t "$IMG:$COMMIT_TAG" \
            -t "$IMG:latest" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            .

          # :latest is still moved, but nothing that deploys reads it. It exists
          # so a from-scratch `terraform apply` -- whose app-service module
          # declares `<repo>:latest` as the task definition's bootstrap image --
          # creates the service on a current build rather than an ancient one.
          DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable image digest (got: ${DIGEST:-<empty>})"
            exit 1
          fi
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"
          echo "Built $COMMIT_TAG -> $DIGEST"

      - name: Register immutable task definition and deploy
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet - image is in ECR, skipping deploy"
            exit 0
          fi
          bash .github/scripts/deploy-ecs-image.sh
