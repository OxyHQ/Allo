name: Publish OTA update

# Publishes Allo's JS bundle and assets to Oxy Updates (oxy-api), channel
# `production`, on every push to main that can change what the app runs. The
# binary polls https://api.oxy.so/updates/v1/apps/<client id>/manifest
# (`withOxyUpdates` in packages/frontend/app.config.js) and accepts an update
# only for its own runtime: the app `version` (appVersion policy). A native
# change bumps `version`, which also makes android-release.yml build and
# release a new binary.
#
# No secret. Authentication is GitHub trusted publishing (oxy ADR 0057): the job
# asks GitHub for an OIDC token addressed to https://api.oxy.so, and oxy-api
# exchanges it for a five-minute `updates:publish` token of the Allo app,
# only for this repository, refs/heads/main and THIS file's path
# (.github/workflows/publish-update.yml; renaming it breaks publishing).

# The export and publish are OxyHQ/oxy's shared .github/workflows/publish-ota-update.yml;
# `workflow_ref` in the OIDC token still names THIS file, so keep its path.

on:
  push:
    branches: [main]
    paths:
      - packages/frontend/**
      - packages/shared-types/**
      - packages/contracts/**
      - packages/sdk/**
      - packages/core/**
      - packages/react/**
      - patches/**
      - package.json
      - bun.lock
      - .github/workflows/publish-update.yml

permissions: {}

concurrency:
  group: oxy-updates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: OxyHQ/oxy/.github/workflows/publish-ota-update.yml@main
    with:
      app_dir: packages/frontend
      # The application's PUBLIC client id (not a secret): the one in the manifest URL.
      client_id: oxy_dk_7b2fab6623e0ac753b38319664d4f0c6bb164e5fc219f60f
      node_version: '24'
