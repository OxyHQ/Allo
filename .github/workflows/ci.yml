# Typecheck + tests on every PR.
#
# Allo had no workflow that ran either, which meant the moderation suite —
# including the test pinning `deliverableTypes()` to exactly `['user']`, the one
# thing that fails if somebody ever wires end-to-end-encrypted `message` content
# up for review — executed nowhere. A privacy control that is not enforced is a
# comment.
#
# Deliberately minimal: install, lint, typecheck, test. No coverage thresholds,
# no matrix. The point is that the guards RUN on every PR; anything more is a
# second thing to keep green.
#
# Two jobs rather than two steps: the frontend needs no database and the backend
# needs no expo tree, so neither should wait on the other's failure.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # bump-base-digests.yml opens its PR with GITHUB_TOKEN, which triggers no
  # `pull_request` run, so it dispatches this workflow on its branch instead.
  # A dispatch is a non-PR event: every job below runs, the image smoke and the
  # reviewed-image check included.
  workflow_dispatch:

permissions:
  contents: read

# A push to a pull request supersedes its previous run; a push to main never
# cancels, so every merged commit keeps its own post-merge evidence.
#
# The flag alone is not enough: GitHub cancels a PENDING run whenever a newer
# one joins the same group, whatever `cancel-in-progress` says. With one group
# for all of main, and runs queueing behind the org's shared 20-job cap, a
# merge whose run was still pending was cancelled by the next merge (measured:
# run 36717068654 for 1a5f89a, cancelled with no jobs by the push of 68fea5f).
# So a non-PR run gets its own group per commit and nothing can supersede it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Affected-only jobs on pull requests. The org shares 20 concurrent jobs across
  # every repository, so a PR that touches only the frontend should not hold a
  # Postgres-backed backend job. Pushes to main (and any other event) run every
  # job regardless: each job's `if` treats a non-PR event as "everything
  # changed", and this job does not run at all there.
  #
  # Shared inputs mark everything: the lockfile, root manifests and config,
  # patches, and .github/** (this workflow and the scripts it runs). The SDK
  # packages are consumed by both apps, so changing them runs the apps too.
  changes:
    name: Detect affected packages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
      image: ${{ steps.filter.outputs.image }}
      backend: ${{ steps.filter.outputs.backend }}
      sdk: ${{ steps.filter.outputs.sdk }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'bun.lock'
              - 'package.json'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'patches/**'
              - '.github/**'
            deploy:
              - *shared
            # Every input of the production image: the Dockerfile and both
            # ignore files, the two workspaces it ships, and the manifests the
            # frozen install validates.
            image:
              - *shared
              - '.dockerignore'
              - 'packages/backend/**'
              - 'packages/contracts/**'
              - 'vendor/**'
              - 'packages/shared-types/**'
              - 'packages/*/package.json'
            sdk: &sdk
              - *shared
              - 'packages/contracts/**'
              - 'vendor/**'
              - 'packages/shared-types/**'
              - 'packages/core/**'
              - 'packages/react/**'
            backend:
              - *sdk
              - 'packages/backend/**'
            frontend:
              - *sdk
              - 'packages/frontend/**'
              - 'scripts/**'
              - 'performance-budgets.json'

  # Gates the rollout logic deploy-aws.yml runs against production.
  #
  # The script and this harness STARTED as copies of Mention's. They are no
  # longer byte-identical and the claim that they were is removed rather than
  # softened: measured, the two differ by 163 lines — Mention has a
  # zero-desired-count escape hatch Allo does not, and Allo now has a
  # configurable migration command Mention does not need. Believing they are the
  # same file is worse than knowing they diverged, because it invites a fix in
  # one to be assumed present in the other.
  deploy-script-test:
    name: Deploy Script Tests
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.deploy == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Verify deployment transaction safeguards
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-deploy-ecs-image.sh
          bash .github/scripts/test-deploy-scope.sh

  backend:
    name: Backend typecheck + tests
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    # Measured 1-2 min on main; the bound only stops a hang from holding one of
    # the org's 20 shared job slots for GitHub's 6-hour default.
    timeout-minutes: 20
    env:
      # The server the realdb suites create their throwaway databases ON. Plain
      # `postgres`, the maintenance database — never a database a suite writes
      # to, which is why `dropTestDatabase` can refuse anything outside its own
      # generated name pattern.
      TEST_DATABASE_URL: postgres://allo:allo@127.0.0.1:5432/postgres
    # The backend needs a real Postgres and nothing else. It is a service
    # container rather than an in-process server because there is no
    # memory-server equivalent, and a mocked insert accepts statements the
    # server rejects outright — deferred constraint triggers, unique indexes,
    # CHECKs, `FOR UPDATE SKIP LOCKED` — which is precisely the class of defect
    # a mocked suite cannot see.
    #
    # Plain `postgres:17-alpine`: this schema needs no PostGIS, no pgvector and
    # no pg_trgm, so nothing here requires a runner that can host one.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: allo
          POSTGRES_PASSWORD: allo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # NOT a literal version. `packageManager: "bun@x.y.z"` in package.json
          # is the one pin; `check:bun-pin` (lint job) fails when the
          # Dockerfile's BUN_VERSION or any workflow disagrees with it, so CI,
          # the image and the bun that regenerates bun.lock cannot drift apart.
          bun-version-file: package.json

      # postinstall builds @allo/shared-types, which the backend compiles against.
      - name: Install
        run: bun install

      - name: Typecheck backend
        run: bun run typecheck:backend

      - name: Test backend
        run: bun run --filter @allo/backend test

      # The same suite again on Bun's built-in client, the opt-in driver
      # production switches to with DATABASE_DRIVER=bun-sql (src/db/driver.ts).
      # Every connection a suite opens follows the variable: the admin one, the
      # migrator and the service's pool. Bun opens all 10 pool connections on
      # the first query where postgres.js opens them as needed, so this run holds
      # far more connections: measured, 32 parallel workers exhaust this image's
      # default max_connections (100) and a 4-vCPU runner's 4 workers do not.
      - name: Test backend on Bun.SQL
        env:
          DATABASE_DRIVER: bun-sql
        run: bun run --filter @allo/backend test

  # The SDK packages the app and the backend integration test build on. They
  # need no Postgres: @allo/core's e2e suite runs against its in-memory fake
  # server, which validates every request with the same zod contract the
  # backend validates with, so contract drift fails here before it fails there.
  sdk:
    name: SDK typecheck + tests (@allo/shared-types, @allo/core, @allo/react)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.sdk == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install

      - name: Typecheck SDK packages
        run: bun run --filter @allo/shared-types typecheck && bun run typecheck:core && bun run typecheck:react

      - name: Test SDK packages
        run: bun run --filter @allo/shared-types test && bun run --filter @allo/core test && bun run --filter @allo/react test

  frontend:
    name: Frontend typecheck
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    # Measured 3-4 min on main, the web export included; same reason as above.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The Expo SDK 58 CLI (export, lint) supports Node 22.13+ / 24.3+ only.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install

      # KNOWN GAP, so nobody reads a green tick as more than it is: typed routes
      # are NOT covered here. `experiments.typedRoutes` is on, but the route
      # union lives in packages/frontend/.expo/types/router.d.ts, which is
      # generated by `expo start`/`expo export` and gitignored — so on a fresh
      # checkout it is absent and every `router.push()` argument degrades to
      # plain `string`. Expo ships no standalone typegen command to generate it
      # here, and running a full web export just to typecheck costs minutes.
      #
      # Generating it locally no longer closes the gap either, so do not reach for
      # that as a workaround. Since app/(chat)/[username].tsx exists, a dynamic
      # segment sits at the root of a group and emits `/${SingleRoutePart<T>}`
      # into the href union, which with T = string collapses to `/${string}` —
      # satisfied by every path. Measured both ways: with that file present tsc
      # accepts router.push('/definitely/not/a/route'); with it moved aside tsc
      # rejects it.
      #
      # What covers routes instead is a test, and it runs in the job below:
      # __tests__/routes/navigationTargets.test.ts reads the routes off app/ and
      # the destinations out of the source and compares them.
      - name: Typecheck frontend
        run: bun run typecheck:frontend

      # The frontend had a `test` script that nothing ran, so its tests were green
      # only on the machine of whoever launched them by hand — the same state as
      # having none. Coverage that does not run is not coverage.
      #
      # `bun run --filter`, and not `bun test`: they are different runners and only
      # one of them works here. The script is jest under the jest-expo preset,
      # which is what strips the Flow types off React Native's entrypoint and
      # applies the `__mocks__` stand-ins for native modules no test process can
      # load. Bun's own runner does neither, so `bun test` parses
      # `react-native/index.js` raw and dies on `import typeof`.
      - name: Test frontend
        run: bun run --filter @allo/frontend test

      # The allo-frontend Worker (`packages/frontend/worker/`): asset pass-through
      # and `/.well-known` routing of the composed Worker. Bun's own runner, not
      # jest: the Worker is plain ESM with no React Native in it.
      - name: Test edge Worker
        run: bun run test:edge

      - name: Guard bundle imports
        run: bun run check:bundle-imports

      - name: Export frontend
        run: bun run build:frontend

      # The export succeeds and the budget passes even when every page ships
      # without a <script> (SDK 58's +html contract); this fails that build.
      - name: Every exported page loads the app
        run: bun run check:web-export-html

      - name: Enforce web bundle budget
        run: bun run check:web-bundle-budget

      - name: Mutation-test performance gates
        run: bun run test:performance-gates

  # Biome formats and lints the whole repository (`biome.jsonc`); the frontend's
  # minimal ESLint config keeps only the eslint-plugin-expo rules Biome has no
  # equivalent for. Cheap and repo-wide, so it runs on every PR regardless of
  # which paths changed.
  lint:
    name: Lint (Biome + Expo ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The Expo SDK 58 CLI (export, lint) supports Node 22.13+ / 24.3+ only.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install

      - name: Managed team API contract
        run: bun run check:team-openapi

      # Every Oxy app shares one Postgres: a new migration may not hold a lock
      # that stalls a hot table. Rules from @oxy.so/db; baseline and hot tables
      # in packages/backend's db:check-locks script.
      - name: Migration lock gate
        run: bun run --filter @allo/backend db:check-locks

      - name: Biome
        run: bunx biome ci .

      - name: Expo ESLint (frontend)
        run: bun run --filter @allo/frontend lint

      # package.json's `packageManager` is the one bun pin: every setup-bun step
      # reads it, and this fails when the backend Dockerfile's BUN_VERSION (a
      # literal the image needs before any package.json exists) disagrees.
      - name: Bun pin
        run: bun run check:bun-pin

      # The production image's build inputs (Dockerfile, context, target and
      # both .dockerignore files) must match the one reviewed pin in
      # .github/scripts/reviewed-images.json. The deploy refuses to build on a
      # mismatch, so catching it here is what stops a merge from stranding
      # main undeployable. It lives in this job because this job has no
      # path filter: it runs on every pull request and `CI complete` fails
      # with it. The fixture tests run first so a green check means the gate
      # can fail, not that it stopped looking.
      - name: Prove the reviewed-image gate can fail
        run: python3 -B -m unittest discover -s .github/scripts -p test_reviewed_image.py
      - name: Prove the base-image digest bump works on fixtures
        run: python3 -B -m unittest discover -s .github/scripts -p test_bump_base_digests.py
      - name: Verify the production image's build inputs are reviewed
        run: python3 -B .github/scripts/reviewed-image.py check

  # Builds the production image exactly as deploy-aws.yml does (the reviewed
  # Dockerfile and context from `guard`, linux/arm64 on an arm64 runner), then
  # boots it. The deploy is the only other place this image is built, and it
  # runs after merge: before this job, a Dockerfile change was first exercised by
  # the production rollout.
  #
  # It reads the deploy's `allo` GHA cache scope and never writes it (no
  # --cache-to), loads the image into the runner's daemon and never pushes.
  # Asserted, in order: the runtime user is uid 1000 and owns nothing under
  # /app and can write nothing there, while /tmp stays writable; node_modules is
  # exactly the production closure (no typescript, no test tools, no SDK
  # workspaces, no Expo or React Native); the deploy's migration commands run in
  # the image as that user; and the server boots in production mode and answers
  # the ALB's `GET /` and `/health/ready`.
  image-smoke:
    name: Image build + boot (linux/arm64)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.image == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: allo
          POSTGRES_PASSWORD: allo
          POSTGRES_DB: allo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allo -d allo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IMAGE: allo-image-smoke:${{ github.sha }}
      # The containers share the runner's network, so the service's mapped
      # port is reachable on 127.0.0.1.
      DATABASE_URL: postgres://allo:allo@127.0.0.1:5432/allo
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `--cache-from type=gha` needs the Actions runtime token and cache URL,
      # which GitHub gives to JavaScript actions and NOT to `run:` steps.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v4

      # The same refusal the deploy runs: unreviewed inputs stop here, and the
      # Dockerfile, context and label values below are its outputs.
      - name: Refuse unreviewed image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe allo

      - name: Build the production image (linux/arm64, loaded, not pushed)
        env:
          DOCKERFILE: ${{ steps.reviewed.outputs.dockerfile }}
          CONTEXT: ${{ steps.reviewed.outputs.context }}
          SOURCE_TREE: ${{ steps.reviewed.outputs.source_tree }}
          BUILD_INPUTS_SHA256: ${{ steps.reviewed.outputs.build_inputs_sha256 }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=allo \
            -f "$DOCKERFILE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "io.oxy.source.tree=$SOURCE_TREE" \
            --label "io.oxy.build-inputs.sha256=$BUILD_INPUTS_SHA256" \
            --load \
            -t "$IMAGE" \
            "$CONTEXT"
          docker image inspect "$IMAGE" --format 'size={{.Size}} arch={{.Architecture}} user={{.Config.User}}'

      - name: Runtime user owns and can write nothing under /app
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE" --format '{{.Architecture}}')" = arm64
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = bun
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = 1000
          test "$(docker run --rm --entrypoint id "$IMAGE" -un)" = bun
          # Owned by root, group root, and not world-writable: every file and
          # directory under /app (symlinks carry no permissions of their own).
          bad=$(docker run --rm --user 0 --entrypoint sh "$IMAGE" -c \
            'find /app ! -type l \( ! -user 0 -o ! -group 0 -o -perm -0002 \) -print')
          if [ -n "$bad" ]; then echo "::error::not root-owned or world-writable:"; echo "$bad"; exit 1; fi
          # The probe can see a writable path: as root the same write succeeds.
          docker run --rm --user 0 --entrypoint sh "$IMAGE" -c 'touch /app/.write-probe'
          # As the app user, every write into the app must fail, and /tmp must work.
          docker run --rm --entrypoint sh "$IMAGE" -euc '
            for path in /app /app/node_modules /app/packages/backend /app/packages/backend/src \
                        /app/packages/backend/drizzle /app/packages/shared-types/src; do
              if touch "$path/.write-probe" 2>/dev/null; then
                echo "::error::the runtime user can write to $path"; exit 1
              fi
            done
            if echo tampered 2>/dev/null >> /app/packages/backend/server.ts; then
              echo "::error::the runtime user can modify server.ts"; exit 1
            fi
            if echo tampered 2>/dev/null >> /app/node_modules/express/package.json; then
              echo "::error::the runtime user can modify node_modules"; exit 1
            fi
            writable=$(find /app ! -type l | while IFS= read -r f; do
              if [ -w "$f" ]; then echo "$f"; fi
            done | head -n 5)
            if [ -n "$writable" ]; then echo "::error::writable by the runtime user: $writable"; exit 1; fi
            touch /tmp/.write-probe && rm /tmp/.write-probe
            echo "uid $(id -u): /app read-only to the app, /tmp writable"
          '

      - name: node_modules is exactly the production closure
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'echo "runtime node_modules: $(du -sm /app/node_modules | cut -f1) MB"; ls /app/packages'
          test "$(docker run --rm --entrypoint sh "$IMAGE" -c 'ls /app/packages | tr "\n" " "')" = "backend contracts shared-types "
          docker run --rm \
            -v "$PWD/.github/scripts:/checks:ro" \
            --entrypoint bun "$IMAGE" \
            /checks/check-runtime-closure.mjs /app packages/backend packages/shared-types packages/contracts

      # Genesis with `--phase=all` (the documented from-zero run), then the
      # deploy's own pre/post commands, which must find nothing left. All three
      # run as the image's user, as the deploy's one-shot tasks do.
      - name: Migrate as the runtime user (the deploy's commands)
        run: |
          set -euo pipefail
          for phase in all pre post; do
            docker run --rm --network host -e DATABASE_URL "$IMAGE" \
              bun run --cwd packages/backend db:migrate --target-database=allo --phase=$phase
          done

      - name: Boot in production mode and answer the load balancer
        run: |
          set -euo pipefail
          docker run -d --name allo-smoke --network host \
            -e NODE_ENV=production -e PORT=8080 -e DATABASE_URL \
            "$IMAGE"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null 2>&1; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' allo-smoke)" != true ]; then break; fi
            sleep 1
          done
          ready=$(curl -fsS http://127.0.0.1:8080/health/ready) || { docker logs allo-smoke; exit 1; }
          root=$(curl -fsS http://127.0.0.1:8080/) || { docker logs allo-smoke; exit 1; }
          echo "GET /health/ready -> $ready"
          echo "GET / -> $root"
          grep -q '"status":"ready"' <<<"$ready"
          grep -q 'Welcome to Allo API' <<<"$root"
          # ECS stops a task with SIGTERM; the drain must run, not a kill.
          # Captured first: `docker logs | grep -q` dies of SIGPIPE under pipefail.
          docker stop -t 20 allo-smoke >/dev/null
          logs=$(docker logs allo-smoke 2>&1)
          tail -n 20 <<<"$logs"
          grep -q 'HTTP, sockets, Redis and PostgreSQL closed' <<<"$logs"

      - name: Server logs on failure
        if: failure()
        run: docker logs allo-smoke 2>&1 | tail -n 200 || true

  # The one check branch protection should require. A job skipped because the
  # PR does not touch its paths reports `skipped`; one that failed or was
  # cancelled (including a timeout, which GitHub reports as cancelled) fails
  # this gate. `changes` is in `needs` so a broken filter fails it too.
  ci-complete:
    name: CI complete
    if: always()
    needs: [changes, lint, deploy-script-test, backend, sdk, frontend, image-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::a CI job failed or was cancelled"
            exit 1
          fi
