# Typecheck + tests on every PR.
#
# Allo had no workflow that ran either, which meant the moderation suite —
# including the test pinning `deliverableTypes()` to exactly `['user']`, the one
# thing that fails if somebody ever wires end-to-end-encrypted `message` content
# up for review — executed nowhere. A privacy control that is not enforced is a
# comment.
#
# Deliberately minimal: install, typecheck, test. No coverage thresholds, no
# matrix, no lint gate. The point is that the guards RUN on every PR; anything
# more is a second thing to keep green.
#
# Two jobs rather than two steps: the frontend needs no MongoDB binary and the
# backend needs no expo tree, so neither should wait on the other's failure.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates the rollout logic deploy-aws.yml runs against production. The script
  # and this harness are byte-identical copies of Mention's, so they share its
  # test rather than growing a second, drifting one.
  deploy-script-test:
    name: Deploy Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Verify deployment transaction safeguards
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-deploy-ecs-image.sh

  backend:
    name: Backend typecheck + tests
    runs-on: ubuntu-latest
    env:
      # Pinned rather than left to float, so the binary cache key below is stable
      # and a new upstream default cannot change what CI runs without a commit.
      MONGOMS_VERSION: 8.2.6
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Must match packages/backend/Dockerfile and the local bun used to
          # regenerate bun.lock — a mismatch fails the install on the lockfile.
          bun-version: 1.3.14

      # The backend suite runs against a real MongoDB replica set (see
      # packages/backend/vitest.globalSetup.ts). Without this cache every run
      # re-downloads the server binary, which is slow enough to make people stop
      # trusting the job.
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      # postinstall builds @allo/shared-types, which the backend compiles against.
      - name: Install
        run: bun install

      - name: Typecheck backend
        run: bun run typecheck:backend

      - name: Test backend
        run: bun run --filter @allo/backend test

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install

      # KNOWN GAP, so nobody reads a green tick as more than it is: typed routes
      # are NOT covered here. `experiments.typedRoutes` is on, but the route
      # union lives in packages/frontend/.expo/types/router.d.ts, which is
      # generated by `expo start`/`expo export` and gitignored — so on a fresh
      # checkout it is absent and every `router.push()` argument degrades to
      # plain `string`. Expo ships no standalone typegen command to generate it
      # here, and running a full web export just to typecheck costs minutes.
      # Everything else IS checked; a developer who has run the app locally sees
      # strictly more than this job does.
      - name: Typecheck frontend
        run: bun run typecheck:frontend

      # The frontend had a `test` script that nothing ran, so its tests were green
      # only on the machine of whoever launched them by hand — the same state as
      # having none. Coverage that does not run is not coverage.
      #
      # `bun run --filter`, and not `bun test`: they are different runners and only
      # one of them works here. The script is jest under the jest-expo preset,
      # which is what strips the Flow types off React Native's entrypoint and
      # resolves the `__mocks__` stand-in for the Matrix binding — a package whose
      # entry calls into a native module no test process can load. Bun's own runner
      # does neither, so `bun test` parses `react-native/index.js` raw and dies on
      # `import typeof`. Everything except the four suites that need the binding's
      # enum values at runtime does run under both.
      - name: Test frontend
        run: bun run --filter @allo/frontend test
